<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSN Manager v11.2 - Smart Paste (JP Edition)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="regionModal">
    <div class="modal-content">
        <h3 style="margin-top:0; color:#ccc">Gdzie kupiono?</h3>
        <select id="modalRegionSelect"></select>
        <button class="modal-btn" onclick="confirmMove()">POTWIERDŹ</button>
        <button class="modal-btn" style="background:#444;" onclick="closeModal()">ANULUJ</button>
    </div>
</div>

<div class="container">
    <div class="top-bar">
        <div id="ratesDisplay" class="rates-info">Kursy walut: Pobieranie...</div>
        <div>
            <button class="btn-backup" onclick="exportData()">📤 EKSPORT</button>
            <button class="btn-backup" onclick="document.getElementById('importFile').click()">📥 IMPORT</button>
            <input type="file" id="importFile" style="display:none" onchange="importData(this)">
        </div>
    </div>

    <div class="main-box">
        <!-- Ukryte pole na ID gry dla edycji/wyszukiwania -->
        <input type="hidden" id="gameId">

        <div class="search-row">
            <input type="text" id="searchInp" placeholder="Wpisz nazwę gry..." oninput="syncSearch()">
            <a id="psLink" href="#" target="_blank" class="btn-search-compact">🔍 ZNAJDŹ ID</a>
        </div>
        <div class="flex-row">
            <input type="text" id="gameName" placeholder="Nazwa gry" style="flex: 2;">
            <select id="gameEd" style="max-width: 150px;">
                <option>Standard</option>
                <option>Deluxe</option>
                <option>Gold</option>
                <option>Ultimate</option>
                <option>GOTY</option>
            </select>
        </div>
        <div class="region-grid">
            <button class="reg-btn bg-pl" onclick="openPsn('pl-pl')">PL 🇵🇱</button>
            <button class="reg-btn bg-tr" onclick="openPsn('en-tr')">TR 🇹🇷</button>
            <button class="reg-btn bg-in" onclick="openPsn('en-in')">IN 🇮🇳</button>
            <button class="reg-btn bg-jp" onclick="openPsn('ja-jp')">JP 🇯🇵</button>
        </div>
        <div class="price-grid">
            <input type="number" id="pPL" placeholder="PLN" step="any">
            <input type="number" id="pTR" placeholder="TRY" step="any">
            <input type="number" id="pIN" placeholder="INR" step="any">
            <input type="number" id="pJP" placeholder="JPY" step="any">
        </div>
        <button class="btn-save" onclick="saveGame()">ZAPISZ GRĘ</button>
    </div>
    
    <div class="section-header" style="border-color: var(--ps-blue);">
        <span style="color:var(--ps-blue); font-weight:bold;">WATCHLISTA</span>
        <input type="text" class="search-bar" id="wSearch" placeholder="Szukaj..." oninput="render()">
    </div>
    <table>
        <thead>
            <tr>
                <th>Gra / Edycja</th>
                <th>PLN</th>
                <th>TRY</th>
                <th>INR</th>
                <th>JPY</th>
                <th>Akcje</th>
            </tr>
        </thead>
        <tbody id="wBody"></tbody>
    </table>
    
    <div class="section-header" style="border-color: #2e7d32;">
        <span style="color:#2e7d32; font-weight:bold;">KOLEKCJA</span>
        <input type="text" class="search-bar" id="cSearch" placeholder="Szukaj..." oninput="render()">
    </div>
    <div class="filter-cnt">
        <button class="filt-btn active" data-r="ALL" onclick="setFilter('ALL')">WSZYSTKIE</button>
        <button class="filt-btn" data-r="PL" onclick="setFilter('PL')">PL 🇵🇱</button>
        <button class="filt-btn" data-r="TR" onclick="setFilter('TR')">TR 🇹🇷</button>
        <button class="filt-btn" data-r="IN" onclick="setFilter('IN')">IN 🇮🇳</button>
        <button class="filt-btn" data-r="JP" onclick="setFilter('JP')">JP 🇯🇵</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>Tytuł</th>
                <th>Region</th>
                <th>Data</th>
                <th>Opcje</th>
            </tr>
        </thead>
        <tbody id="cBody"></tbody>
    </table>

    <div class="links-section">
        <div class="links-title">🔗 SZYBKIE DOŁADOWANIA PORTFELA</div>
        <div class="links-grid">
            <a href="https://gg.deals/gift-cards-group/playstation-network-card-try-turkey/" target="_blank" class="link-btn">🇹🇷 Turcja</a>
            <a href="https://gg.deals/gift-cards-group/playstation-network-card-inr-india/" target="_blank" class="link-btn">🇮🇳 Indie</a>
            <a href="https://www.play-asia.com/digital/playstation_network/14/711z3#fc=v:2" target="_blank" class="link-btn">🇯🇵 Play-Asia (JP)</a>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
